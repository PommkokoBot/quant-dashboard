name: Daily data fetch

on:
  schedule:
    # 23:30 UTC = 06:30 Thailand time (covers prior-day US close + same-day Asia close)
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Pull full price history instead of the last 10 days (use for first run / backfill)"
        type: boolean
        default: false
      lookback_days:
        description: "Override the incremental lookback window (days)"
        type: number
        default: 10

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices (Yahoo Finance)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.full_history }}" = "true" ]; then
            python scripts/fetch_prices.py --full-history
          else
            python scripts/fetch_prices.py --lookback-days "${{ inputs.lookback_days || 10 }}"
          fi

      - name: Fetch macro series (FRED)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ inputs.full_history }}" = "true" ]; then
            python scripts/fetch_macro.py --full-history
          else
            python scripts/fetch_macro.py --lookback-days "${{ inputs.lookback_days || 10 }}"
          fi
        # Don't fail the whole run if macro fetch has issues (e.g. FRED_API_KEY not
        # added yet) -- the price fetch above is the critical path for the dashboard.
        continue-on-error: true
