name: Daily data fetch

on:
  schedule:
    # 04:00 UTC = 11:00 Thailand time. The number that matters is the distance
    # from the US close (21:00 UTC in winter, 20:00 in summer), not the local
    # hour: Yahoo posts the big funds within a couple of hours but small
    # thematic ETFs lag by several more, and a fetch that runs too early
    # returns a PARTIAL universe with no error at all -- 54 of 93 on
    # 2026-11-10, which then became a fact sheet whose Breadth was computed
    # over 24 funds instead of 93. The boundary measured across those two runs
    # sits between 5 and 7 hours after the close, so 7 is the floor here and
    # 04:00 UTC clears it all year without any DST handling.
    #
    # The previous 22:23 UTC was moved here on 2026-11-13 (round B1). It was
    # set on 2026-11-09 to buy room before the pg_cron window, which looked
    # safe only because the GitHub queue was running 3-4 hours late and had
    # been hiding the problem; shortening the delay uncovered it.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Pull full price history instead of the last 10 days (use for first run / backfill)"
        type: boolean
        default: false
      lookback_days:
        description: "Override the incremental lookback window (days)"
        type: number
        default: 10

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # requirements.txt pins nothing (pandas>=2.0.0 and friends), so each run
      # installs whatever is newest that night. Printing the resolved versions
      # costs a second and leaves the one piece of evidence we would otherwise
      # lack: when the pipeline changes behaviour without anyone touching the
      # code, this is what two runs can be compared against.
      - name: Record installed versions
        run: pip freeze

      - name: Fetch prices (Yahoo Finance)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.full_history }}" = "true" ]; then
            python scripts/fetch_prices.py --full-history
          else
            python scripts/fetch_prices.py --lookback-days "${{ inputs.lookback_days || 10 }}"
          fi

      # The price step fails the job (-> GitHub e-mails the workflow owner) when
      # the health check finds an instrument erroring 3 run-days in a row or
      # 3+ trading days stale. Macro data should still be fetched in that case.
      - name: Fetch macro series (FRED)
        if: success() || failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ inputs.full_history }}" = "true" ]; then
            python scripts/fetch_macro.py --full-history
          else
            python scripts/fetch_macro.py --lookback-days "${{ inputs.lookback_days || 10 }}"
          fi
        # Don't fail the whole run if macro fetch has issues (e.g. FRED_API_KEY not
        # added yet) -- the price fetch above is the critical path for the dashboard.
        continue-on-error: true

      # Market event calendar (2026-09-21): FOMC (curated file), CPI/PCE release
      # dates (FRED), US elections and monthly option expiry (rules). Runs even
      # if an earlier step failed; a FRED list that fails its sanity check makes
      # this step fail (-> e-mail) and nothing is written for that event type.
      - name: Sync market events
        if: success() || failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_events.py

      # Build the day's fact sheet here, in the same job, the moment the three
      # fetch steps above have landed their data. pg_cron also tries every 30
      # minutes between 04:00 and 08:30 UTC, but that window is a guess about
      # when the data will arrive, and the GitHub queue has been measured
      # between 1.9 and 10.5 hours late -- on a slow day the window closes
      # before the prices land and the sheet for that day is never built at
      # all. Doing it here removes the guess; pg_cron stays as the backstop
      # for the day this whole job fails to run.
      #
      # It must come AFTER the macro and event steps, not just after prices:
      # the sheet has a macro group and a 14-day event group in it.
      #
      # The script also fills in any sheet missing from the last 10 trading
      # days. Without that, a day the completeness gate refuses would stay
      # empty forever: once tomorrow's prices arrive the "latest date" has
      # moved on, and nothing would ever come back for it.
      #
      # Exits 0 when the gate refuses -- that is the gate working, and the
      # watchdog reports it at 09:00 UTC. Only a database error turns it red.
      - name: Build fact sheets
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/build_facts.py

      # The brief lives here rather than on a schedule of its own because the
      # fact sheet it reads only exists once the steps above have landed the
      # day's prices -- and the GitHub queue makes "a time by which the data is
      # surely in" impossible to name (measured 6h late on 2026-11-10).
      # Chaining it means the brief goes out as soon as the data is ready
      # instead of at a fixed hour that is wrong on both the fast and slow days.
      #
      # A held brief exits 0 on purpose: the gates refusing to publish is the
      # system working, and Telegram carries the reason. Only a real failure
      # turns this step red, so red keeps meaning "something needs fixing".
      - name: Daily brief
        timeout-minutes: 30
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS }}
          GEMINI_THINKING_LEVEL: ${{ secrets.GEMINI_THINKING_LEVEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/brief.py
